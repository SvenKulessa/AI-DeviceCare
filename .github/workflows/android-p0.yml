name: Android P0 build and core tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: android-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6 (runner managed; no unverified wrapper binary)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
      - name: Install Android platform SDK
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.0.0"
          gradle --version
      - name: Independent pipeline unit tests
        run: gradle --no-daemon :core:quality:testDebugUnitTest :core:scoring:testDebugUnitTest
      - name: Build two isolated Android apps
        run: gradle --no-daemon :apps:devicecare:assembleDebug :apps:devicecare-plus:assembleDebug
      - name: Android lint
        run: gradle --no-daemon :apps:devicecare:lintDebug :apps:devicecare-plus:lintDebug
      - name: Artifact provenance
        run: |
          sha256sum apps/devicecare/build/outputs/apk/debug/devicecare-debug.apk
          sha256sum apps/devicecare-plus/build/outputs/apk/debug/devicecare-plus-debug.apk
          echo "head_sha=${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Publish internal-only debug artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-devicecare-p0-internal
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/devicecare/build/outputs/apk/debug/*.apk
            apps/devicecare-plus/build/outputs/apk/debug/*.apk
