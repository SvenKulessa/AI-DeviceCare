name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-and-policy:
    name: Governance and APK policy fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate repository policy
        run: node scripts/validate-governance.mjs
      - name: Run governance and APK policy fixtures
        run: node --test scripts/validate-governance.test.mjs scripts/verify-apk-policy.test.mjs
