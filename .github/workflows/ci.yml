name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-and-policy:
    name: Governance and APK policy fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository policy
        run: node scripts/validate-governance.mjs
      - name: Run governance and APK policy fixtures
        run: node --test scripts/validate-governance.test.mjs scripts/verify-apk-policy.test.mjs
