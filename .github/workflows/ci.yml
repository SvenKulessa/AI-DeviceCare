# Complementary CI contract checks. Android P0 build and core tests
# (.github/workflows/android-p0.yml) is the authoritative full Android gate:
# Gradle unit tests, both APK builds, lint, Trivy, source permission policy,
# negative APK-policy fixtures, actual packaged APK manifest and provenance.
# Do not duplicate the Android SDK/Gradle setup here or interpret this workflow
# passing as approval when the independent Android P0 gate fails.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance-and-policy:
    name: Governance and policy-contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate root governance
        run: node scripts/validate-governance.mjs
      - name: Verify governance and APK-policy negative fixtures
        run: node --test scripts/validate-governance.test.mjs scripts/verify-apk-policy.test.mjs
