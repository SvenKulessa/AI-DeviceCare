name: Android 15 emulator UI and collector smoke QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android15-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android15-ui:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            name: android16-target-sdk-inspection
            artifact: devicecare-api36-inspection-results
            script: >-
              gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
              -Pandroid.testInstrumentationRunnerArguments.expectedApi=36
              -Pandroid.testInstrumentationRunnerArguments.class=online.capitalai.devicecare.M1InspectionAccessibilityTest#userClickMakesOnlyScopedLocalObservationsVisible
          - api: 35
            name: android15-ui
            artifact: devicecare-android15-ui-results
            script: >-
              adb -e shell settings put system font_scale 2.0 &&
              gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
              -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=2.0 &&
              mkdir -p apps/devicecare/build/reports/process-qa &&
              python3 scripts/verify-emulator-process-restart.py
              apps/devicecare/build/outputs/apk/debug/devicecare-debug.apk
              > apps/devicecare/build/reports/process-qa/process-restart.json &&
              cat apps/devicecare/build/reports/process-qa/process-restart.json
          - api: 33
            name: android13-permission-compatibility
            artifact: devicecare-api33-permission-results
            script: >-
              gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
              -Pandroid.testInstrumentationRunnerArguments.expectedApi=33
              -Pandroid.testInstrumentationRunnerArguments.class=online.capitalai.devicecare.M1InspectionAccessibilityTest#reducedCollectorCapsPermissionMetadataSampling
          - api: 32
            name: android12l-permission-compatibility
            artifact: devicecare-api32-permission-results
            script: >-
              gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
              -Pandroid.testInstrumentationRunnerArguments.expectedApi=32
              -Pandroid.testInstrumentationRunnerArguments.class=online.capitalai.devicecare.M1InspectionAccessibilityTest#reducedCollectorCapsPermissionMetadataSampling
          - api: 26
            name: android8-minimum-sdk-inspection
            artifact: devicecare-api26-inspection-results
            script: >-
              gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
              -Pandroid.testInstrumentationRunnerArguments.expectedApi=26
              -Pandroid.testInstrumentationRunnerArguments.class=online.capitalai.devicecare.M1InspectionAccessibilityTest#userClickMakesOnlyScopedLocalObservationsVisible
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM for headless emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo timeout 10s udevadm trigger --settle --name-match=kvm
          if ! timeout 10s bash -c 'until [[ -c /dev/kvm && -r /dev/kvm && -w /dev/kvm ]]; do sleep 0.25; done'; then
            echo "::error::KVM device did not become readable and writable within 10 seconds"
            ls -l /dev/kvm || true
            id
            exit 1
          fi
          stat -c 'KVM ready: %n (%F, mode %a, owner %U:%G)' /dev/kvm
      - name: Install compile platform 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Compose instrumentation tests
        run: gradle --no-daemon :apps:devicecare:assembleDebugAndroidTest
      - name: Run on Android emulator (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ${{ matrix.script }}
      - name: Capture redacted instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/devicecare/build/outputs/androidTest-results/connected/**/*.xml
            apps/devicecare/build/reports/androidTests/connected/**
            apps/devicecare/build/reports/process-qa/process-restart.json
