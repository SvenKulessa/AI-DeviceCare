name: Android 15 emulator UI and collector smoke QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android15-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android15-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM for headless emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install compile platform 36
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Compose instrumentation tests
        run: gradle --no-daemon :apps:devicecare:assembleDebugAndroidTest
      - name: Run on Android 15 emulator (API 35, 200% font scale)
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: >-
            adb -e shell settings put system font_scale 2.0 &&
            gradle --no-daemon :apps:devicecare:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.expectedFontScale=2.0
      - name: Capture redacted instrumentation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devicecare-android15-ui-results
          retention-days: 7
          if-no-files-found: warn
          path: |
            apps/devicecare/build/outputs/androidTest-results/connected/**/*.xml
            apps/devicecare/build/reports/androidTests/connected/**
