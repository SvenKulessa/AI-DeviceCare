name: Play Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer, must increase)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-aab:
    name: Build signed AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :apps:devicecare:bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PversionName="${{ inputs.version_name }}" \
            -PversionCode="${{ inputs.version_code }}" \
            --no-daemon

      - name: Verify AAB
        run: |
          AAB="apps/devicecare/build/outputs/bundle/release/devicecare-release.aab"
          ls -lh "$AAB"
          sha256sum "$AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: devicecare-release-aab-${{ inputs.version_name }}
          path: apps/devicecare/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload R8 mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devicecare-mapping-${{ inputs.version_name }}
          path: apps/devicecare/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
