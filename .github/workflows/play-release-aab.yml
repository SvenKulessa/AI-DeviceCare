name: Play Release AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        type: string
      version_code:
        description: 'Version code (integer, must increase)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-signed-aab:
    name: Build signed AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.6.0'

      - name: Install Android build SDK
        run: |
          SDK_MANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          "$SDK_MANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate version inputs before accessing signing secrets
        env:
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: gradle --no-daemon :apps:devicecare:tasks -PversionName="$RELEASE_VERSION_NAME" -PversionCode="$RELEASE_VERSION_CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/devicecare-release.keystore"
          test -s "$RUNNER_TEMP/devicecare-release.keystore"

      - name: Build signed AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          gradle :apps:devicecare:bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/devicecare-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
            -PversionName="$RELEASE_VERSION_NAME" \
            -PversionCode="$RELEASE_VERSION_CODE" \
            --no-daemon

      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/devicecare-release.keystore"

      - name: Verify AAB
        run: |
          AAB="apps/devicecare/build/outputs/bundle/release/devicecare-release.aab"
          ls -lh "$AAB"
          sha256sum "$AAB"

      - name: Upload signed AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devicecare-release-aab-${{ inputs.version_name }}
          path: apps/devicecare/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Upload R8 mapping file
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devicecare-mapping-${{ inputs.version_name }}
          path: apps/devicecare/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn
