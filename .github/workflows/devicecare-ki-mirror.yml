name: DeviceCare-KI eight-hour source mirror and isolated Android tests

on:
  schedule:
    - cron: '17 */8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devicecare-ki-backup-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Sync upstream commit to backup branch and immutable tag
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.sync.outputs.source_sha }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Fetch exact upstream main and fast-forward backup (no source code execution)
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p "$RUNNER_TEMP/devicecare-mirror"
          cd "$RUNNER_TEMP/devicecare-mirror"
          git init -q
          git remote add upstream https://github.com/SvenKulessa/DeviceCare-KI.git
          git remote add backup "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags upstream refs/heads/main
          source_sha="$(git rev-parse FETCH_HEAD)"
          test "${#source_sha}" -eq 40
          target=refs/heads/backup/devicecare-ki-main
          previous="$(git ls-remote backup "$target" | awk '{print $1}')"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          if [[ "$previous" == "$source_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Backup already matches source main: $source_sha"
            exit 0
          fi
          if [[ -n "$previous" ]]; then
            git fetch --no-tags backup "$target"
            if ! git merge-base --is-ancestor "$previous" "$source_sha"; then
              echo "::error::Source history rewound or diverged; refusing to overwrite backup."
              exit 1
            fi
          fi
          # The token is used only for a Git push. Never checkout or execute source code here.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$header" push --atomic backup \
            "$source_sha:$target" \
            "$source_sha:refs/tags/backup/devicecare-ki/$source_sha"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Mirrored source SHA $source_sha and created immutable recovery tag."

  android-checks:
    name: Verify mirrored source without write credentials
    needs: mirror
    if: needs.mirror.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - name: Checkout the exact upstream SHA without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SvenKulessa/DeviceCare-KI
          ref: ${{ needs.mirror.outputs.source_sha }}
          persist-credentials: false
      - name: Scan source for severe vulnerabilities, exposed secrets and licensing failures
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Install JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.3.1'
      - name: Install Android 36.1 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36.1" "build-tools;36.0.0"
      - name: Create ephemeral internal-only debug signing key
        shell: bash
        run: |
          set -euo pipefail
          test ! -e debug.keystore
          keytool -genkeypair -noprompt -keystore debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=Android Debug,O=DeviceCare-KI Test Mirror,C=DE"
          chmod 600 debug.keystore
      - name: Validate mirrored Android source
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify signed debug artifact and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" \
            > evidence/apk-signature.txt
          sha256sum "$apk" > evidence/apk-sha256.txt
          printf 'source=SvenKulessa/DeviceCare-KI\nsource_sha=%s\nkind=internal-debug-backup-test\n' \
            '${{ needs.mirror.outputs.source_sha }}' > evidence/source.txt
      - name: Save test APK and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: devicecare-ki-mirror-debug-${{ needs.mirror.outputs.source_sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            evidence/apk-sha256.txt
            evidence/apk-signature.txt
            evidence/source.txt
