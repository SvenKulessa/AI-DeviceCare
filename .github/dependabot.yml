# AI-DeviceCare: bounded, review-only supply-chain updates.
# Security alerts/updates are controlled separately by GitHub Security settings.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:15"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]
